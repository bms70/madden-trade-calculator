<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madden League Trade Calculator v1.1.0</title>
<style>:root{--navy:#14213d;--blue:#2f75b5;--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#5b6473;--input:#d9eafa;--line:#cbd5e1;--green:#d9ead3;--amber:#fff2cc;--red:#f4cccc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Segoe UI,Arial,sans-serif}header{background:var(--navy);color:#fff;padding:24px;text-align:center}header h1{margin:0 0 6px}.wrap{max-width:1500px;margin:auto;padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar button{padding:10px 14px;background:var(--blue);color:#fff;border:0;border-radius:7px;cursor:pointer}.note{color:var(--muted)}.team,.result,.intel{background:var(--card);margin:16px 0;border-radius:12px;overflow:auto;box-shadow:0 2px 14px #0001}.team h2{margin:0;padding:12px 16px;background:var(--blue);color:#fff}.head,.asset-row{display:grid;grid-template-columns:110px 180px 120px 70px 70px 90px 105px 100px 100px 100px 110px 110px 100px;gap:6px;min-width:1300px;padding:6px 10px}.head{background:#e7e6e6;font-weight:700}.asset-row input,.asset-row select{width:100%;padding:7px;background:var(--input);border:1px solid var(--line);border-radius:5px}.value,.total{font-weight:700;text-align:right;padding:8px}.result,.intel{padding:18px}.verdict{font-size:30px;font-weight:900}.intel-grid{display:grid;grid-template-columns:190px 1fr;gap:1px;background:#ddd}.intel-grid div{padding:10px;background:#fff}.intel-grid .key{background:var(--navy);color:#fff;font-weight:700}.fair{background:var(--green)!important}.questionable{background:var(--amber)!important}.unfair,.league-breaking{background:var(--red)!important}.site-nav{margin-top:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.site-nav a{display:inline-block;padding:9px 13px;border:1px solid #ffffff66;border-radius:7px;color:#fff;text-decoration:none;font-weight:700;min-height:40px}.site-nav a:hover,.site-nav a:focus{background:#ffffff18;outline:2px solid #fff;outline-offset:2px}
@media(max-width:960px){.wrap{padding:14px}.team{scrollbar-width:thin}.asset-row input,.asset-row select,.toolbar button{min-height:42px}}
@media(max-width:720px){header{padding:20px 14px}header h1{font-size:25px}.wrap{padding:10px}.toolbar{align-items:stretch;flex-direction:column}.toolbar button{width:100%}.team{overflow:visible}.team h2{font-size:17px}.head{display:none}.asset-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;gap:9px;padding:12px;margin:10px;border:1px solid var(--line);border-radius:9px;background:#f8fafc}.asset-row>*{min-width:0}.asset-row .type,.asset-row .name,.asset-row .timing,.asset-row .league,.asset-row .value{grid-column:1/-1}.asset-row .value{text-align:left;background:#eef2f7;border-radius:5px}.asset-row .value:before{content:'Value: ';font-weight:600}.total{text-align:left;padding:12px 14px}.result,.intel{padding:14px}.verdict{font-size:26px}.intel-grid{grid-template-columns:1fr}.intel-grid .key{margin-top:4px}.site-nav a{flex:1 1 120px}}</style></head>
<body><header><h1>Madden League Trade Calculator</h1><p><strong>Release v1.1.0</strong> &middot; <strong>Ruleset v4.0</strong></p><p>Premium top-10 draft curve, narrow pick-only FAIR window, and 1.01 haul protection.</p><nav class="site-nav" aria-label="Site navigation"><a href="index.html" aria-current="page">Calculator</a><a href="help.html">How to Use</a></nav></header><main class="wrap"><div class="toolbar"><span class="note">Blue cells are inputs. Package credit: 100%, 90%, 75%, 60%, then 50%.</span><button id="clear" type="button">Clear trade</button></div><div id="teams"></div><section class="result"><div>TRADE VERDICT</div><div id="verdict" class="verdict">Add assets to both sides</div><div id="difference"></div></section><section class="intel"><h2>Trade Intelligence</h2><div id="intel" class="intel-grid"></div></section></main>
<script>
const FIRST=[90,83,77,71,67,63,60,57,55,53,50,48,46,44,42,40,38,37,36,35,34,33,32,31,30,29,28,27,26,25,24,23];
const PICKS={}; FIRST.forEach((v,i)=>PICKS[`1.${String(i+1).padStart(2,'0')}`]=v);
Object.assign(PICKS,{"Early 2nd":19,"Mid 2nd":16,"Late 2nd":13,"Early 3rd":9,"Mid 3rd":7,"Late 3rd":5,"4th":4,"5th":3,"6th":2,"7th":1,"Future Early 1st":67,"Future Mid 1st":46,"Future Late 1st":31,"Future 1st - Unknown":44});
const TIMING={"Current draft":1,"Next year":.85,"Two years away":.70};
const WEIGHTS=[1,.9,.75,.6,.5,.5,.5,.5,.5];
const POS={QB:1.4,EDGE:1.2,CB:1.15,WR:1.15,LT:1.1,DT:1.05,TE:1,S:1,LB:.95,HB:.9,IOL:.9,FB:.5,K:.5,P:.5};
const positions=Object.keys(POS),devs=['Normal','Star','Superstar','X-Factor'],timings=Object.keys(TIMING),picks=Object.keys(PICKS);
function option(v){return `<option value="${v}">${v}</option>`}
function row(team,i){return `<div class="asset-row" data-team="${team}" data-i="${i}"><select class="type"><option value=""></option>${option('Player')}${option('Draft Pick')}</select><select class="name"><option value=""></option>${picks.map(option).join('')}</select><select class="timing"><option value=""></option>${timings.map(option).join('')}</select><input class="ovr" type="number" min="0" max="99"><input class="age" type="number" min="18" max="50"><select class="pos"><option value=""></option>${positions.map(option).join('')}</select><select class="dev"><option value=""></option>${devs.map(option).join('')}</select><input class="cap" type="number" min="0" step=".1"><input class="years" type="number" min="1" max="10"><input class="league" type="number" min="0" max="40"><select class="current"><option value=""></option>${option('Starter')}${option('Backup')}</select><select class="projected"><option value=""></option>${option('Starter')}${option('Backup')}</select><div class="value">0.0</div></div>`}
function team(n){return `<section class="team"><h2>TEAM ${n} RECEIVES</h2><div class="head"><div>Asset Type</div><div>Player / Pick</div><div>Timing</div><div>OVR</div><div>Age</div><div>Position</div><div>Dev Trait</div><div>Cap Hit</div><div>Years Rem.</div><div>Years League</div><div>Current Role</div><div>Projected Role</div><div>Value</div></div>${Array.from({length:9},(_,i)=>row(n,i)).join('')}<div class="total">TEAM ${n} RAW TOTAL: <span id="raw${n}">0.0</span> | ADJUSTED: <span id="adj${n}">0.0</span></div></section>`}
document.getElementById('teams').innerHTML=team('A')+team('B');
function field(r,c){return r.querySelector(c).value}
function playerCore(r){
 const o=+field(r,'.ovr'),a=+field(r,'.age'),p=field(r,'.pos'),d=field(r,'.dev');
 if(!field(r,'.ovr')||!field(r,'.age')||!p||!d)return 0;
 let v=Math.max(0,o-60)*POS[p];
 const age=a<=23?0:a<=26?1:a<=29?2:a<=31?3:4;
 const matrix={Normal:[1.15,1.1,1,.8,.65],Star:[1.35,1.25,1.15,1.05,.9],Superstar:[1.65,1.5,1.3,1.15,1],"X-Factor":[2,1.75,1.5,1.3,1.15]};
 v*=matrix[d][age];
 const cap=field(r,'.cap')===''?0:+field(r,'.cap');
 v*=p==='QB'?(cap<=10?1.15:cap<=20?1.08:cap<=35?1:cap<=50?.9:.8):(cap<=5?1.15:cap<=10?1.08:cap<=20?1:cap<=30?.9:.8);
 if(a<=26&&o>=87&&(d==='Superstar'||d==='X-Factor'))v*=1.25;
 const yl=field(r,'.league'); v*=yl===''?1:+yl===0?1.5:+yl===1?1.3:+yl===2?1.15:1;
 const c=field(r,'.current'),q=field(r,'.projected');
 if(c&&q)v*=c==='Starter'&&q==='Starter'?1:c==='Starter'&&q==='Backup'?.85:c==='Backup'&&q==='Starter'?.95:.75;
 if(o>=70&&o<=79&&a>=31)v*=a<=32?.9:a<=34?.75:.6;
 const yr=field(r,'.years')===''?1:Math.min(+field(r,'.years'),5),ctrl=[0,1,1.07,1.16,1.25,1.34][yr];
 const tier=p==='QB'?(cap<=10?'great':cap<=20?'good':cap<=35?'normal':cap<=50?'exp':'very'):(cap<=5?'great':cap<=10?'good':cap<=20?'normal':cap<=30?'exp':'very');
 v*=tier==='very'?1:tier==='exp'?1+(ctrl-1)/2:ctrl;
 return v;
}
function validPlayerRow(r){return field(r,'.ovr')!==''&&field(r,'.age')!==''&&field(r,'.pos')!==''&&field(r,'.dev')!==''}
function rows(team){return [...document.querySelectorAll(`[data-team="${team}"]`)]}
function youngestQB(team){const ages=rows(team).filter(r=>field(r,'.type')==='Player'&&validPlayerRow(r)&&field(r,'.pos')==='QB').map(r=>+field(r,'.age'));return ages.length?Math.min(...ages):null}
function qbAgeFactor(age,opposingAge){if(opposingAge===null)return 1;const diff=opposingAge-age;if(diff>0)return diff<=2?1.05:diff<=4?1.1:1.15;if(diff<0){const d=-diff;return d<=2?.98:d<=4?.95:.9}return 1}
function data(team,opposingQB){let arr=[];rows(team).forEach((r,rowIndex)=>{const type=field(r,'.type'),name=field(r,'.name');let value=0;if(type==='Draft Pick'&&name in PICKS)value=PICKS[name]*(TIMING[field(r,'.timing')]||1);else if(type==='Player'&&validPlayerRow(r)){value=playerCore(r);if(field(r,'.pos')==='QB')value*=qbAgeFactor(+field(r,'.age'),opposingQB)}r.querySelector('.value').textContent=value.toFixed(1);if(value>0)arr.push({type,name,value,row:r,rowIndex})});return arr}
function adjusted(arr){return [...arr].sort((a,b)=>b.value-a.value||a.rowIndex-b.rowIndex).reduce((sum,x,i)=>sum+x.value*WEIGHTS[Math.min(i,8)],0)}
function best(arr){return Math.max(0,...arr.map(x=>x.value))}
function allDraft(arr){return arr.length>0&&arr.every(x=>x.type==='Draft Pick')}
function draftPremium(stronger,other){return stronger===90?1.15:stronger>=77?1.08:stronger>other*1.08?1.04:1}
function playerProtection(arr){let elite=false,corner=false;arr.forEach(x=>{if(x.type!=='Player')return;const r=x.row,o=+field(r,'.ovr'),a=+field(r,'.age'),p=field(r,'.pos'),d=field(r,'.dev'),premium=a<=26&&(d==='Superstar'||d==='X-Factor');if(premium&&p==='QB'&&o>=90)elite=true;if(premium&&o>=87)corner=true});return elite?1.3:corner?1.2:1.1}
function rawDraft(arr){return arr.filter(x=>x.type==='Draft Pick').reduce((s,x)=>s+x.value,0)}
function verdictFromGap(gap){return gap<.12?'QUESTIONABLE':gap<.22?'UNFAIR':'LEAGUE-BREAKING'}
function recalc(){
 const youngA=youngestQB('A'),youngB=youngestQB('B');
 const A=data('A',youngB),B=data('B',youngA);
 const rawA=A.reduce((s,x)=>s+x.value,0),rawB=B.reduce((s,x)=>s+x.value,0),adjA=adjusted(A),adjB=adjusted(B),bestA=best(A),bestB=best(B);
 document.getElementById('rawA').textContent=rawA.toFixed(1);document.getElementById('rawB').textContent=rawB.toFixed(1);document.getElementById('adjA').textContent=adjA.toFixed(1);document.getElementById('adjB').textContent=adjB.toFixed(1);
 const v=document.getElementById('verdict'),diff=document.getElementById('difference'),intel=document.getElementById('intel');
 if(!A.length||!B.length){v.textContent='Add assets to both sides';v.className='verdict';diff.textContent='';intel.innerHTML='';return}
 const draftOnly=allDraft(A)&&allDraft(B);let fair=false,primary='',requiredText='';
 if(draftOnly){if(bestA>bestB){const req=draftPremium(bestA,bestB),target=adjA*req;fair=adjB>=target&&adjB<=target*1.08;requiredText=`Team B target ${target.toFixed(1)}-${(target*1.08).toFixed(1)}`;}else if(bestB>bestA){const req=draftPremium(bestB,bestA),target=adjB*req;fair=adjA>=target&&adjA<=target*1.08;requiredText=`Team A target ${target.toFixed(1)}-${(target*1.08).toFixed(1)}`;}else fair=Math.abs(adjA-adjB)/Math.max(adjA,adjB)<=.08;primary=Math.max(bestA,bestB)===90?'1.01 haul protection: 115% required return with an 8% acceptance window.':Math.max(bestA,bestB)>=77?'Top-three draft protection and the 8% acceptance window are active.':'Graduated one-sided draft protection and the 8% acceptance window are active.';}else{const reqA=playerProtection(A),reqB=playerProtection(B);fair=adjA>=adjB*reqB&&adjB>=adjA*reqA;const maxReq=Math.max(reqA,reqB);primary=maxReq===1.3?'Elite QB protection is the biggest driver.':maxReq===1.2?'Franchise Cornerstone protection is the biggest driver.':'Standard player acquisition thresholds and package quality are active.';requiredText=`Team A requires ${reqB.toFixed(2)}x; Team B requires ${reqA.toFixed(2)}x`;}
 const gap=Math.abs(adjA-adjB)/Math.max(adjA,adjB),grade=fair?'FAIR':verdictFromGap(gap);v.textContent=grade;v.className='verdict '+grade.toLowerCase();diff.textContent=`Adjusted difference: ${(gap*100).toFixed(1)}%${requiredText?' | '+requiredText:''}`;
 const draftA=rawDraft(A),draftB=rawDraft(B);const draftRead=draftA===0&&draftB===0?'No draft capital in this trade.':draftA>draftB?'Team A receives more raw draft capital.':draftB>draftA?'Team B receives more raw draft capital.':'Draft capital is even.';
 const packageRead=A.length>=3||B.length>=3?'Quantity-for-quality protection is active.':'Package compression is limited in this deal.';
 const correction=fair?'No correction needed.':adjA<adjB?'Team A needs additional adjusted value.':'Team B needs additional adjusted value.';
 intel.innerHTML=[['Primary Read',primary],['Best Asset',`Team A ${bestA.toFixed(1)} | Team B ${bestB.toFixed(1)}`],['Raw Value',`Team A ${rawA.toFixed(1)} | Team B ${rawB.toFixed(1)}`],['Adjusted Value',`Team A ${adjA.toFixed(1)} | Team B ${adjB.toFixed(1)}`],['Draft Capital',draftRead],['Package Structure',packageRead],['Suggested Correction',correction]].map(x=>`<div class="key">${x[0]}</div><div>${x[1]}</div>`).join('');
}
document.addEventListener('input',recalc);document.addEventListener('change',recalc);document.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('input').forEach(x=>x.value='');document.querySelectorAll('select').forEach(x=>x.value='');recalc()});recalc();
</script></body></html>
