<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madden League Trade Calculator v3.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff0;--card:#fff;--ink:#14231c;--mut:#5d6b64;--line:#d5dbd8;--turf:#1d6b46;--turfbg:#e3f0e9;--flag:#e6b422;--ok:#1d7a47;--warn:#a8740f;--bad:#c4352a;--lb:#8a1c1c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18201c;--ink:#e7eee9;--mut:#93a39a;--line:#2a352f;--turf:#4cc38a;--turfbg:#1c2d24;--flag:#f0c63c;--ok:#4cc38a;--warn:#e8b04a;--bad:#f07b6e;--lb:#ff8f8f;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,.num,.tab,.vd{font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
header{background:var(--turf);color:#fff;padding:18px 16px 0;border-bottom:4px solid var(--flag)}
@media(prefers-color-scheme:dark){header{color:#0b1410}}
header h1{margin:0;font-size:1.7rem;font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 12px;opacity:.85;font-size:.95rem;max-width:70ch}
.tabs{display:flex;gap:4px}
.tab{border:0;background:rgba(255,255,255,.18);color:inherit;padding:8px 18px;border-radius:8px 8px 0 0;font-size:1.05rem;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:14px 12px 24px}
.sides{display:grid;gap:14px}
@media(min-width:900px){.sides{grid-template-columns:1fr 1fr;align-items:start}}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.side h2{margin:0 0 8px;font-size:1.25rem;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.side h2 small{font:500 .9rem Barlow,sans-serif;color:var(--mut)}
.row{border-top:1px solid var(--line);padding:10px 0}
.rh{display:flex;gap:8px;align-items:center}
.rh select{flex:0 0 auto;width:auto;font-weight:500}
.tier{color:var(--mut);font-size:.85rem;flex:1;min-width:0}
.v{font-size:1.25rem;font-weight:700;min-width:3.2em;text-align:right}
.v.bad{color:var(--bad);font-size:.85rem;font-weight:500;font-family:Barlow,sans-serif}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:8px}
label span{display:block;font-size:.8rem;color:var(--mut);margin-bottom:2px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-height:38px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--turf);outline-offset:1px}
.x{border:0;background:none;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--bad)}
.add{margin-top:6px;border:1px dashed var(--turf);background:var(--turfbg);color:var(--turf);padding:8px 12px;border-radius:8px;font:600 .95rem Barlow,sans-serif;cursor:pointer;width:100%}
.add:disabled{opacity:.5;cursor:default}
.tot{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:500}
.tot b{font-size:1.2rem}
.res{position:sticky;bottom:0;margin-top:14px;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--mut);border-radius:10px;padding:12px 14px;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.res .top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.vd{font-size:2rem;font-weight:700;line-height:1}
.res .meta{color:var(--mut);font-size:.9rem}
.res p{margin:6px 0 0}
.res.FAIR{border-left-color:var(--ok)}.res.FAIR .vd{color:var(--ok)}
.res.QUESTIONABLE{border-left-color:var(--warn)}.res.QUESTIONABLE .vd{color:var(--warn)}
.res.UNFAIR{border-left-color:var(--bad)}.res.UNFAIR .vd{color:var(--bad)}
.res.LB{border-left-color:var(--lb)}.res.LB .vd{color:var(--lb)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:var(--mut);font-size:.85rem}
.foot button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
@media(prefers-reduced-motion:no-preference){.vd{transition:color .2s}}
</style>
</head>
<body>
<header>
  <h1>Madden League Trade Calculator v3.3</h1>
  <p>Enter what each team receives. Rookie season is Year 0. Contract control, premium-asset protection and package quality all affect trade value.</p>
</header>
<main id="app"></main>
<script>
// ---------- Rule tables (from the workbook's Logic Tables and Rules sheets) ----------
const POS={QB:1.4,EDGE:1.2,CB:1.15,WR:1.15,LT:1.1,DT:1.05,TE:1,S:1,LB:.95,HB:.9,IOL:.9,FB:.5,K:.5,P:.5};
const DEV={Normal:[1.15,1.1,1,.8,.65],Star:[1.35,1.25,1.15,1.05,.9],Superstar:[1.65,1.5,1.3,1.15,1],"X-Factor":[2,1.75,1.5,1.3,1.15]};
const PICK={"1.01-1.05":70,"1.06-1.10":58,"1.11-1.16":49,"1.17-1.24":40,"1.25-1.32":32,"Early 2nd":20,"Mid 2nd":17,"Late 2nd":14,"Early 3rd":11,"Mid/Late 3rd":8,"4th":5,"5th":3,"6th":2,"7th":1,"Future Early 1st":82,"Future Mid 1st":68,"Future Late 1st":55,"Future 1st - Unknown":62};
const TIM={"Current draft":1,"Next year":.85,"Two years away":.7};
const TN=["Great","Good","Normal","Expensive","Very Expensive"],TM=[1.15,1.08,1,.9,.8];
const POSL=Object.keys(POS),DEVL=Object.keys(DEV),PICKL=Object.keys(PICK),TIML=Object.keys(TIM),ROLE=["Starter","Backup"];
const MAXROWS=9;

// ---------- Valuation (same order of multipliers as the workbook formula) ----------
const num=v=>v===""||v==null?null:Number(v);
const tierIdx=r=>{const c=num(r.cap)||0,th=r.pos==="QB"?[10,20,35,50]:[5,10,20,30],i=th.findIndex(x=>c<=x);return i<0?4:i};
const ctl=y=>y==null||y===1?1:y===2?1.07:y===3?1.16:y===4?1.25:1.34;
function value(r,other){
  if(r.t==="Draft Pick") return r.pick?PICK[r.pick]*(TIM[r.tim]??1):null;
  const o=num(r.ovr),a=num(r.age);
  if(!r.pos||!r.dev||o==null||a==null) return null;
  const ai=a<=23?0:a<=26?1:a<=29?2:a<=31?3:4,ti=tierIdx(r);
  let v=Math.max(0,o-60)*DEV[r.dev][ai]*POS[r.pos]*TM[ti];
  if(a<=26&&o>=87&&(r.dev==="Superstar"||r.dev==="X-Factor")) v*=1.25;
  const yl=num(r.yil); v*=yl==null?1:yl===0?1.5:yl===1?1.3:yl===2?1.15:1;
  if(r.cr&&r.pr) v*=r.cr==="Starter"?(r.pr==="Starter"?1:.85):(r.pr==="Starter"?.95:.75);
  if(o>=70&&o<=79&&a>=31) v*=a<=32?.9:a<=34?.75:.6;
  const c=ctl(num(r.yr)); v*=ti<=2?c:ti===3?1+(c-1)/2:1;
  if(r.pos==="QB"){
    const ages=other.filter(x=>x.t==="Player"&&x.pos==="QB"&&num(x.age)!=null).map(x=>+x.age);
    if(ages.length){const m=Math.min(...ages),d=Math.abs(a-m);
      if(a<m) v*=d<=2?1.05:d<=4?1.1:1.15; else if(a>m) v*=d<=2?.98:d<=4?.95:.9;}
  }
  return v;
}
const pkg=vals=>{const n=vals.filter(v=>v!=null);return vals.map(v=>{if(v==null)return null;const k=1+n.filter(x=>x>v).length;return v*(k===1?1:k===2?.9:k===3?.75:k===4?.6:.5)})};
// Required return multiplier set by the premium assets in a list of rows
const req=rows=>{
  const p=rows.filter(r=>r.t==="Player"&&num(r.age)!=null&&num(r.ovr)!=null&&+r.age<=26&&(r.dev==="Superstar"||r.dev==="X-Factor"));
  return p.some(r=>r.pos==="QB"&&+r.ovr>=90)?1.3:p.some(r=>+r.ovr>=87)?1.2:1.1;
};
function calc(s){
  const va=s.A.map(r=>value(r,s.B)),vb=s.B.map(r=>value(r,s.A)),pa=pkg(va),pb=pkg(vb);
  const sum=x=>x.reduce((t,v)=>t+(v||0),0),cnt=x=>x.filter(v=>v!=null).length;
  const NA=sum(va),NB=sum(vb),OA=sum(pa),PB=sum(pb);
  const QA=req(s.B),RB=req(s.A);               // "Required A" and "Required B" on the sheet
  const diff=(OA===0||PB===0)?null:Math.abs(OA-PB)/Math.max(OA,PB);
  let verdict;
  if(diff===null) verdict="Add assets to both sides";
  else if(OA>=PB*RB&&PB>=OA*QA) verdict="FAIR";
  else verdict=diff<.12?"QUESTIONABLE":diff<.22?"UNFAIR":"LEAGUE-BREAKING";
  let ex;
  if(NA===0||NB===0) ex="Add assets to both sides to generate an explanation.";
  else if(QA===1.3||RB===1.3) ex="Elite QB protection applies: acquiring a young elite QB requires a 130% adjusted return.";
  else if(QA===1.2||RB===1.2) ex="Franchise Cornerstone protection applies: acquiring the cornerstone requires a 120% adjusted return.";
  else if(cnt(va)>=3||cnt(vb)>=3) ex="Quantity-for-quality protection applies: lower-ranked package assets receive reduced credit.";
  else ex={"FAIR":"Adjusted return clears the required acquisition threshold.","QUESTIONABLE":"Trade requires commissioner review after premium-asset adjustments.","UNFAIR":"Trade is materially short after package and acquisition adjustments."}[verdict]||"Trade is severely imbalanced after package and acquisition adjustments.";
  return {va,vb,NA,NB,OA,PB,QA,RB,diff,verdict,ex};
}

// ---------- State ----------
const blank=()=>({t:"Player",pick:"",tim:"Current draft",ovr:"",age:"",pos:"",dev:"",cap:"",yr:"",yil:"",cr:"",pr:""});
const fresh=()=>({A:[blank(),blank(),blank()],B:[blank(),blank(),blank()]});
let S=[fresh()],cur=0;
try{
  const d=JSON.parse(localStorage.getItem("madden-trade-v33")||"null");
  if(Array.isArray(d)&&d.length>=1&&d[0]&&Array.isArray(d[0].A)&&Array.isArray(d[0].B)) S=[d[0]];
}catch(e){}
const save=()=>{try{localStorage.setItem("madden-trade-v33",JSON.stringify(S))}catch(e){}};

// ---------- Rendering ----------
const $=id=>document.getElementById(id);
const sel=(k,opts,v,ph)=>`<select data-k="${k}">${ph==null?"":`<option value="">${ph}</option>`}${opts.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>`;
const inp=(k,v,ph)=>`<input data-k="${k}" type="number" inputmode="decimal" step="any" min="0" placeholder="${ph}" value="${v}">`;
const L=(t,h)=>`<label><span>${t}</span>${h}</label>`;
function rowHtml(side,i,r){
  const f=r.t==="Player"
    ?L("OVR",inp("ovr",r.ovr,"85"))+L("Age",inp("age",r.age,"25"))+L("Position",sel("pos",POSL,r.pos,"Choose"))+L("Dev trait",sel("dev",DEVL,r.dev,"Choose"))+L("Cap hit ($M)",inp("cap",r.cap,"12.5"))+L("Years remaining",`<input data-k="yr" type="number" inputmode="numeric" step="1" min="1" placeholder="3" value="${r.yr}">`)+L("Years in league",inp("yil",r.yil,"0"))+L("Current role",sel("cr",ROLE,r.cr,"Choose"))+L("Projected role",sel("pr",ROLE,r.pr,"Choose"))
    :L("Pick",sel("pick",PICKL,r.pick,"Choose a pick"))+L("Timing",sel("tim",TIML,r.tim));
  return `<div class="row" data-s="${side}" data-i="${i}"><div class="rh">${sel("t",["Player","Draft Pick"],r.t)}<span class="tier"></span><span class="v"></span><button class="x" data-a="del" aria-label="Remove asset">✕</button></div><div class="f">${f}</div></div>`;
}
function sideHtml(side,title){
  const rows=S[cur][side];
  return `<section class="side" data-side="${side}"><h2>${title}<small></small></h2>${rows.map((r,i)=>rowHtml(side,i,r)).join("")}<button class="add" data-a="add" data-s="${side}"${rows.length>=MAXROWS?" disabled":""}>Add asset</button><div class="tot"><span>Adjusted total</span><b class="num"></b></div></section>`;
}
function render(){
  $("app").innerHTML=`<div class="sides">${sideHtml("A","Team A receives")}${sideHtml("B","Team B receives")}</div><div class="res" id="res" aria-live="polite"><div class="top"><span class="vd" id="vd"></span><span class="meta" id="meta"></span></div><p id="ex"></p></div><div class="foot"><span>Values update as you type and are saved in this browser.</span><button data-a="reset">Clear this trade</button></div>`;
  update();
}
function update(){
  const s=S[cur],c=calc(s);
  [["A",c.va,c.OA],["B",c.vb,c.PB]].forEach(([side,vals,tot])=>{
    const box=document.querySelector(`.side[data-side=${side}]`);
    box.querySelectorAll(".row").forEach((el,i)=>{
      const r=s[side][i],v=vals[i],ve=el.querySelector(".v");
      el.querySelector(".tier").textContent=r.t==="Player"&&r.pos?`Contract: ${TN[tierIdx(r)]}`:"";
      if(v==null){ve.textContent=r.t==="Player"&&(r.ovr||r.age||r.pos||r.dev)?"Needs OVR, age, position, dev":"";ve.className="v bad"}
      else{ve.textContent=v.toFixed(1);ve.className="v num"}
    });
    box.querySelector(".tot b").textContent=tot.toFixed(1);
    box.querySelector("h2 small").textContent=`Raw ${(side==="A"?c.NA:c.NB).toFixed(1)}`;
  });
  const key=c.verdict==="LEAGUE-BREAKING"?"LB":c.verdict;
  $("res").className="res "+(c.diff===null?"":key);
  $("vd").textContent=c.verdict;
  $("meta").textContent=c.diff===null?"":`Value difference ${(c.diff*100).toFixed(1)}% · Required A ${c.QA.toFixed(2)}× · Required B ${c.RB.toFixed(2)}×`;
  $("ex").textContent=c.ex;
  save();
}

// ---------- Events ----------
const app=$("app");
app.addEventListener("input",e=>{
  const el=e.target,row=el.closest(".row");if(!row||!el.dataset.k)return;
  S[cur][row.dataset.s][+row.dataset.i][el.dataset.k]=el.value;
  el.dataset.k==="t"?render():update();
});
app.addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="add"){const rows=S[cur][b.dataset.s];if(rows.length<MAXROWS)rows.push(blank())}
  else if(a==="del"){const row=b.closest(".row"),rows=S[cur][row.dataset.s];rows.splice(+row.dataset.i,1);if(!rows.length)rows.push(blank())}
  else if(a==="reset"){if(!confirm("Clear everything on this trade?"))return;S[cur]=fresh()}
  render();
});
render();
</script>
</body>
</html>
