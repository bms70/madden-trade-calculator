<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madden League Trade Calculator v4.0</title>
<style>:root{--navy:#14213d;--blue:#2f75b5;--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#5b6473;--input:#d9eafa;--line:#cbd5e1;--green:#d9ead3;--amber:#fff2cc;--red:#f4cccc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Segoe UI,Arial,sans-serif}header{background:var(--navy);color:#fff;padding:24px;text-align:center}header h1{margin:0 0 6px}.wrap{max-width:1500px;margin:auto;padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar button{padding:10px 14px;background:var(--blue);color:#fff;border:0;border-radius:7px;cursor:pointer}.note{color:var(--muted)}.team,.result,.intel{background:var(--card);margin:16px 0;border-radius:12px;overflow:auto;box-shadow:0 2px 14px #0001}.team h2{margin:0;padding:12px 16px;background:var(--blue);color:#fff}.head,.asset-row{display:grid;grid-template-columns:110px 180px 120px 70px 70px 90px 105px 100px 100px 100px 110px 110px 100px;gap:6px;min-width:1300px;padding:6px 10px}.head{background:#e7e6e6;font-weight:700}.asset-row input,.asset-row select{width:100%;padding:7px;background:var(--input);border:1px solid var(--line);border-radius:5px}.value,.total{font-weight:700;text-align:right;padding:8px}.result,.intel{padding:18px}.verdict{font-size:30px;font-weight:900}.intel-grid{display:grid;grid-template-columns:190px 1fr;gap:1px;background:#ddd}.intel-grid div{padding:10px;background:#fff}.intel-grid .key{background:var(--navy);color:#fff;font-weight:700}.fair{background:var(--green)!important}.questionable{background:var(--amber)!important}.unfair,.league-breaking{background:var(--red)!important}@media(max-width:720px){.toolbar{align-items:flex-start;flex-direction:column}.intel-grid{grid-template-columns:1fr}.intel-grid .key{margin-top:4px}}</style></head>
<body><header><h1>Madden League Trade Calculator v4.0</h1><p>Premium top-10 draft curve, narrow pick-only FAIR window, and 1.01 haul protection.</p></header><main class="wrap"><div class="toolbar"><span class="note">Blue cells are inputs. Package credit: 100%, 90%, 75%, 60%, then 50%.</span><button id="clear" type="button">Clear trade</button></div><div id="teams"></div><section class="result"><div>TRADE VERDICT</div><div id="verdict" class="verdict">Add assets to both sides</div><div id="difference"></div></section><section class="intel"><h2>Trade Intelligence</h2><div id="intel" class="intel-grid"></div></section></main>
<script>
const FIRST=[90,83,77,71,67,63,60,57,55,53,50,48,46,44,42,40,38,37,36,35,34,33,32,31,30,29,28,27,26,25,24,23];
const PICKS={};FIRST.forEach((v,i)=>PICKS[`1.${String(i+1).padStart(2,'0')}`]=v);Object.assign(PICKS,{"Early 2nd":19,"Mid 2nd":16,"Late 2nd":13,"Early 3rd":9,"Mid 3rd":7,"Late 3rd":5,"4th":4,"5th":3,"6th":2,"7th":1,"Future Early 1st":67,"Future Mid 1st":46,"Future Late 1st":31,"Future 1st - Unknown":44});
const TIMING={"Current draft":1,"Next year":.85,"Two years away":.70},WEIGHTS=[1,.9,.75,.6,.5,.5,.5,.5,.5];
const POS={QB:1.4,EDGE:1.2,CB:1.15,WR:1.15,LT:1.1,DT:1.05,TE:1,S:1,LB:.95,HB:.9,IOL:.9,FB:.5,K:.5,P:.5};
const positions=Object.keys(POS),devs=['Normal','Star','Superstar','X-Factor'],timings=Object.keys(TIMING),picks=Object.keys(PICKS);
function option(v){return `<option value="${v}">${v}</option>`}function row(team,i){return `<div class="asset-row" data-team="${team}" data-i="${i}"><select class="type"><option value=""></option>${option('Player')}${option('Draft Pick')}</select><select class="name"><option value=""></option>${picks.map(option).join('')}</select><select class="timing"><option value=""></option>${timings.map(option).join('')}</select><input class="ovr" type="number" min="0" max="99"><input class="age" type="number" min="18" max="50"><select class="pos"><option value=""></option>${positions.map(option).join('')}</select><select class="dev"><option value=""></option>${devs.map(option).join('')}</select><input class="cap" type="number" min="0" step=".1"><input class="years" type="number" min="1" max="5"><input class="league" type="number" min="0" max="40"><select class="current"><option value=""></option>${option('Starter')}${option('Backup')}</select><select class="projected"><option value=""></option>${option('Starter')}${option('Backup')}</select><div class="value">0.0</div></div>`}
function team(n){return `<section class="team"><h2>TEAM ${n} RECEIVES</h2><div class="head"><div>Asset Type</div><div>Player / Pick</div><div>Timing</div><div>OVR</div><div>Age</div><div>Position</div><div>Dev Trait</div><div>Cap Hit</div><div>Years Rem.</div><div>Years League</div><div>Current Role</div><div>Projected Role</div><div>Value</div></div>${Array.from({length:9},(_,i)=>row(n,i)).join('')}<div class="total">TEAM ${n} RAW TOTAL: <span id="raw${n}">0.0</span> | ADJUSTED: <span id="adj${n}">0.0</span></div></section>`}
document.getElementById('teams').innerHTML=team('A')+team('B');
function playerValue(r){let o=+r.querySelector('.ovr').value,a=+r.querySelector('.age').value,p=r.querySelector('.pos').value,d=r.querySelector('.dev').value;if(!o||!a||!p||!d)return 0;let v=Math.max(0,o-60)*POS[p];let age=a<=23?0:a<=26?1:a<=29?2:a<=31?3:4;let matrix={Normal:[1.15,1.1,1,.8,.65],Star:[1.35,1.25,1.15,1.05,.9],Superstar:[1.65,1.5,1.3,1.15,1],"X-Factor":[2,1.75,1.5,1.3,1.15]};v*=matrix[d][age];let cap=+r.querySelector('.cap').value||0;v*=p==='QB'?(cap<=10?1.15:cap<=20?1.08:cap<=35?1:cap<=50?.9:.8):(cap<=5?1.15:cap<=10?1.08:cap<=20?1:cap<=30?.9:.8);if(a<=26&&o>=87&&(d==='Superstar'||d==='X-Factor'))v*=1.25;let yl=+r.querySelector('.league').value;v*=yl===0?1.5:yl===1?1.3:yl===2?1.15:1;let c=r.querySelector('.current').value,q=r.querySelector('.projected').value;if(c&&q)v*=c==='Starter'&&q==='Starter'?1:c==='Starter'&&q==='Backup'?.85:c==='Backup'&&q==='Starter'?.95:.75;if(o>=70&&o<=79&&a>=31)v*=a<=32?.9:a<=34?.75:.6;let yr=+r.querySelector('.years').value||1,ctrl=[0,1,1.07,1.16,1.25,1.34][Math.min(yr,5)];let tier=p==='QB'?(cap<=20?'good':cap<=35?'normal':cap<=50?'exp':'very'):(cap<=10?'good':cap<=20?'normal':cap<=30?'exp':'very');v*=tier==='very'?1:tier==='exp'?1+(ctrl-1)/2:ctrl;return v}
function data(team){let arr=[];document.querySelectorAll(`[data-team="${team}"]`).forEach(r=>{let type=r.querySelector('.type').value,v=0,name=r.querySelector('.name').value;if(type==='Draft Pick'&&name)v=PICKS[name]*(TIMING[r.querySelector('.timing').value]||1);else if(type==='Player')v=playerValue(r);r.querySelector('.value').textContent=v.toFixed(1);if(v>0)arr.push({type,name,value:v,row:r})});return arr}
function adjusted(arr){return [...arr].sort((a,b)=>b.value-a.value).reduce((s,x,i)=>s+x.value*WEIGHTS[Math.min(i,8)],0)}function best(arr){return Math.max(0,...arr.map(x=>x.value))}function allDraft(arr){return arr.length&&arr.every(x=>x.type==='Draft Pick')}function premium(x,other){return x===90?1.15:x>=77?1.08:x>other*1.08?1.04:1}
function recalc(){let A=data('A'),B=data('B'),rawA=A.reduce((s,x)=>s+x.value,0),rawB=B.reduce((s,x)=>s+x.value,0),adjA=adjusted(A),adjB=adjusted(B),bestA=best(A),bestB=best(B);rawA=+rawA.toFixed(2);rawB=+rawB.toFixed(2);document.getElementById('rawA').textContent=rawA.toFixed(1);document.getElementById('rawB').textContent=rawB.toFixed(1);document.getElementById('adjA').textContent=adjA.toFixed(1);document.getElementById('adjB').textContent=adjB.toFixed(1);let v=document.getElementById('verdict'),diff=document.getElementById('difference'),intel=document.getElementById('intel');if(!A.length||!B.length){v.textContent='Add assets to both sides';v.className='verdict';diff.textContent='';intel.innerHTML='';return}let draftOnly=allDraft(A)&&allDraft(B),fair=false,req=1,primary='';if(draftOnly){if(bestA>bestB){req=premium(bestA,bestB);fair=adjB>=adjA*req&&adjB<=adjA*req*1.08}else if(bestB>bestA){req=premium(bestB,bestA);fair=adjA>=adjB*req&&adjA<=adjB*req*1.08}else fair=Math.abs(adjA-adjB)/Math.max(adjA,adjB)<=.08;primary=Math.max(bestA,bestB)===90?'1.01 haul protection: 115% required return with an 8% acceptance window.':'Graduated one-sided draft trade-up protection and the 8% acceptance window are active.'}else{let cornerA=A.some(x=>x.type==='Player'&&+x.row.querySelector('.age').value<=26&&+x.row.querySelector('.ovr').value>=87&&['Superstar','X-Factor'].includes(x.row.querySelector('.dev').value));let cornerB=B.some(x=>x.type==='Player'&&+x.row.querySelector('.age').value<=26&&+x.row.querySelector('.ovr').value>=87&&['Superstar','X-Factor'].includes(x.row.querySelector('.dev').value));let reqA=cornerA?1.2:1.1,reqB=cornerB?1.2:1.1;fair=adjA>=adjB*reqB&&adjB>=adjA*reqA;primary='Player acquisition thresholds and package quality are active.'}let gap=Math.abs(adjA-adjB)/Math.max(adjA,adjB),grade=fair?'FAIR':gap<.12?'QUESTIONABLE':gap<.22?'UNFAIR':'LEAGUE-BREAKING';v.textContent=grade;v.className='verdict '+grade.toLowerCase();diff.textContent=`Adjusted difference: ${(gap*100).toFixed(1)}%`;let winner=adjA>adjB?'Team A':'Team B';intel.innerHTML=[['Primary Read',primary],['Best Asset',`Team A ${bestA.toFixed(1)} | Team B ${bestB.toFixed(1)}`],['Raw Value',`Team A ${rawA.toFixed(1)} | Team B ${rawB.toFixed(1)}`],['Adjusted Value',`Team A ${adjA.toFixed(1)} | Team B ${adjB.toFixed(1)}`],['Package Structure',`${A.length} asset(s) versus ${B.length} asset(s)`],['Suggested Correction',fair?'No correction needed.':`${winner==='Team A'?'Team B':'Team A'} needs additional adjusted value.`]].map(x=>`<div class="key">${x[0]}</div><div>${x[1]}</div>`).join('')}
document.addEventListener('input',recalc);document.addEventListener('change',recalc);document.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('input').forEach(x=>x.value='');document.querySelectorAll('select').forEach(x=>x.value='');recalc()});recalc();
</script></body></html>
